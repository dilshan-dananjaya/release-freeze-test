name: Release sign-off

on:
  issues:
    types: [opened, edited, closed]
  release:
    types: [published]
  pull_request_target:
    branches: [master]
    types: [closed]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-signoff-${{ github.event.issue.number || 'rc' }}
  cancel-in-progress: false

jobs:
  signoff:
    if: >-
      github.event_name == 'release' ||
      contains(github.event.issue.labels.*.name, 'release-sign-off') ||
      (github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: python3 .github/scripts/release_freeze.py ${{ github.event_name == 'release' && 'new-rc' || github.event_name == 'pull_request_target' && 'publish' || 'signoff' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_REVIEWER: ${{ vars.RELEASE_PR_REVIEWER }}
